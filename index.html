<script id="v401-performance-shim">
(()=>{
  const nativeSetInterval=window.setInterval.bind(window);
  const nativeRAF=window.requestAnimationFrame.bind(window);
  const isBattle=()=>!!document.querySelector('.battleV119,.bsv2_175,.cleanBattleV238,.battleMode');
  window.setInterval=(fn,delay,...args)=>{
    const d=Number(delay)||0;
    if(typeof fn!=='function') return nativeSetInterval(fn,delay,...args);
    let ticks=0;
    return nativeSetInterval(()=>{
      if(document.hidden) return;
      ticks++;
      const battle=isBattle();
      if(!battle && d<=700 && ticks%5!==0) return;
      if(!battle && d>700 && d<=1300 && ticks%4!==0) return;
      if(!battle && d>1300 && d<=2600 && ticks%2!==0) return;
      try{fn(...args)}catch(e){console.warn('V401 interval',e)}
    },Math.max(d,250));
  };
  window.requestAnimationFrame=(cb)=>nativeRAF((t)=>{if(document.hidden)return;cb(t)});
  window.__v401BattleActive=isBattle;
})();
</script>

<script id="v407-early-asset-resolver">
(()=>{
  const PAGE='https://ks5154yt-oss.github.io/bungou-kitan-game/assets/';
  const RAW='https://raw.githubusercontent.com/ks5154yt-oss/bungou-kitan-game/main/assets/';
  const fileName=(src)=>{
    const m=String(src||'').match(/(embedded_[^/?#]+\.(?:png|jpe?g|webp))/i);
    return m ? m[1] : '';
  };
  window.__bkAsset=function(path){
    const s=String(path||'').trim();
    const name=fileName(s);
    if(name) return PAGE+name;
    if(s.startsWith(RAW)){
      const rawName=fileName(s);
      return rawName ? PAGE+rawName : s;
    }
    if(/^(?:https?:|data:|blob:)/i.test(s)) return s;
    try{return new URL(s,document.baseURI).href}catch(_){return s}
  };
})();
</script>
<script id="v411-battle-loader">
(()=>{
  let promise=null;
  const setState=(state)=>{
    document.documentElement.dataset.battleLoad=state;
    window.dispatchEvent(new CustomEvent('bk:battleload',{detail:{state}}));
  };
  window.__bkLoadBattleExtras=function(){
    if(window.__bkBattleExtrasLoaded) return Promise.resolve(true);
    if(promise) return promise;
    setState('loading');
    promise=new Promise((resolve)=>{
      const s=document.createElement('script');
      s.src='battle-extras.js?v=414';
      s.async=true;
      s.onload=()=>{
        window.__bkBattleExtrasLoaded=true;
        setState('ready');
        requestAnimationFrame(()=>requestAnimationFrame(()=>resolve(true)));
      };
      s.onerror=()=>{
        promise=null;
        setState('error');
        resolve(false);
      };
      document.head.appendChild(s);
    });
    return promise;
  };
  window.__bkWarmBattleExtras=function(){
    if('requestIdleCallback' in window){
      requestIdleCallback(()=>window.__bkLoadBattleExtras(),{timeout:900});
    }else{
      setTimeout(()=>window.__bkLoadBattleExtras(),120);
    }
  };
})();
</script>

<script id="v401-lazy-images">
(()=>{
 const tune=(root=document)=>{
   root.querySelectorAll?.('img:not([data-v401])').forEach(img=>{
     img.dataset.v401='1';
     if(!img.closest('.battleV119,.bsv2_175,.cleanBattleV238') && !img.classList.contains('homeVisual')){
       img.loading='lazy'; img.decoding='async';
     } else { img.decoding='async'; }
   });
 };
 tune();
 let queued=false;
 const mo=new MutationObserver(()=>{if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;tune()})});
 mo.observe(document.getElementById('app')||document.body,{subtree:true,childList:true});
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)tune()});
})();
</script>

<script id="v406-pages-asset-fix">
(()=>{
  const PAGE='https://ks5154yt-oss.github.io/bungou-kitan-game/assets/';
  const RAW='https://raw.githubusercontent.com/ks5154yt-oss/bungou-kitan-game/main/assets/';

  function fileName(src){
    const m=String(src||'').match(/(embedded_[^/?#]+\.(?:png|jpe?g|webp))/i);
    return m ? m[1] : '';
  }

  window.__bkAsset=(path)=>{
    const s=String(path||'').trim();
    const name=fileName(s);
    if(name) return PAGE+name;
    if(/^(?:https?:|data:|blob:)/i.test(s)) return s;
    try{return new URL(s,document.baseURI).href}catch(_){return s}
  };

  function arm(img){
    if(!img) return;
    const raw=img.getAttribute('src')||'';
    const name=fileName(raw);
    if(!name) return;

    const current=img.src||raw;
    if(!current.startsWith(PAGE) && !current.startsWith(RAW)){
      img.src=PAGE+name+'?v=406';
    } else if(current.startsWith(RAW)){
      img.src=PAGE+name+'?v=406';
    }

    if(img.dataset.v406Armed==='1') return;
    img.dataset.v406Armed='1';
    img.loading = img.closest('.homeV116,.dedicatedHomeV112,.homeWrap') ? 'eager' : (img.loading || 'lazy');
    img.decoding = 'async';

    img.addEventListener('error',()=>{
      const now=img.src||'';
      if(now.startsWith(PAGE)){
        img.src=RAW+name+'?v=406';
      }
    });
  }

  function scan(){
    document.querySelectorAll('img').forEach(arm);
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',scan,{once:true});
  } else scan();

  new MutationObserver(ms=>{
    for(const m of ms){
      if(m.type==='attributes' && m.target.tagName==='IMG') arm(m.target);
      for(const n of m.addedNodes||[]){
        if(n.nodeType!==1) continue;
        if(n.tagName==='IMG') arm(n);
        n.querySelectorAll?.('img').forEach(arm);
      }
    }
  }).observe(document.documentElement,{
    subtree:true,
    childList:true,
    attributes:true,
    attributeFilter:['src']
  });
})();
</script>
