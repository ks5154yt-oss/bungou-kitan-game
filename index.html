<script id="v407-early-asset-resolver">
(()=>{
  const PAGE='https://ks5154yt-oss.github.io/bungou-kitan-game/assets/';
  const RAW='https://raw.githubusercontent.com/ks5154yt-oss/bungou-kitan-game/main/assets/';
  const fileName=(src)=>{
    const m=String(src||'').match(/(embedded_[^/?#]+\.(?:png|jpe?g|webp))/i);
    return m ? m[1] : '';
  };
  window.__bkAsset=function(path){
    const s=String(path||'').trim();
    const name=fileName(s);
    if(name) return PAGE+name;
    if(s.startsWith(RAW)){
      const rawName=fileName(s);
      return rawName ? PAGE+rawName : s;
    }
    if(/^(?:https?:|data:|blob:)/i.test(s)) return s;
    try{return new URL(s,document.baseURI).href}catch(_){return s}
  };
})();
</script>

<script id="v419-stable-boot">
(()=>{
  const KEY='bk_v419_sw_cleanup';
  try{
    if(!sessionStorage.getItem(KEY)){
      sessionStorage.setItem(KEY,'1');
      if('serviceWorker' in navigator){
        navigator.serviceWorker.getRegistrations?.().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
      }
      if('caches' in window){
        caches.keys().then(keys=>Promise.all(keys.filter(k=>/bungou|kitan|bk/i.test(k)).map(k=>caches.delete(k)))).catch(()=>{});
      }
    }
  }catch(_){}
  window.__bkStableBootV419=true;
